name: OpenAPI spec
on:
  push:
    branches: ['main']
    paths:
      - 'packages/api-gateway/**'
      - 'packages/proto/**'
      - '.github/workflows/openapi.yml'
  workflow_dispatch:

concurrency:
  group: openapi-spec
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate docs/openapi.json
    runs-on: ubuntu-latest
    steps:
      # main requires PRs; this app is allowed to bypass that, and its pushes
      # trigger the Mintlify deploy (GITHUB_TOKEN pushes would not).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.JUNO_BOT_APP_ID }}
          private-key: ${{ secrets.JUNO_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: '24.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protos
        run: pnpm gen-proto

      - name: Regenerate the spec
        run: pnpm docs:openapi

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet docs/openapi.json; then
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add docs/openapi.json
          git commit -m '[Docs] regenerate openapi.json'
          # install/gen-proto can leave other tracked files modified, which makes
          # `git pull --rebase` refuse to run; drop everything except our commit
          git reset --hard HEAD
          # main may have moved while we generated; rebase onto it and retry
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
