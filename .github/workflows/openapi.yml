name: OpenAPI spec
on:
  push:
    branches: ['main']
    paths:
      - 'packages/api-gateway/**'
      - 'packages/proto/**'
      - '.github/workflows/openapi.yml'
  workflow_dispatch:

concurrency:
  group: openapi-spec
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate docs/openapi.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: '24.4'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protos
        run: pnpm gen-proto

      - name: Regenerate the spec
        run: pnpm docs:openapi

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet docs/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/openapi.json
          git commit -m '[Docs] regenerate openapi.json'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mintlify.yml
