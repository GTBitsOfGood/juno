name: Deploy to Mintlify
on:
  push:
    branches: ['main']
    paths: ['docs/**', '.github/workflows/mintlify.yml']
  workflow_call:
permissions:
  id-token: write
  contents: read
concurrency:
  group: mintlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the branch tip, so a call from openapi.yml sees its new commit
          ref: ${{ github.ref }}
      - run: npx mint@latest deploy --subdomain juno-docs --directory docs
