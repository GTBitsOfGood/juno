syntax = "proto3";

package juno.feature_flag;

service FeatureFlagService {
    rpc createFlag(CreateFlagRequest) returns (CreateFlagResponse);
    rpc getFlag(GetFlagRequest) returns (GetFlagResponse);
    rpc setFlag(SetFlagRequest) returns (SetFlagResponse);
    rpc deleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse);
}

message CreateFlagRequest {
    string id = 1;
    bool enabled = 2;
    optional string description = 3;
}

message GetFlagRequest {
    string id = 1;
}

message SetFlagRequest {
    string id = 1;
    bool enabled = 2;
    optional string description = 3;
    
}

message DeleteFlagRequest {
    string id = 1;
}

message CreateFlagResponse {
  FeatureFlag flag = 1;
}

message GetFlagResponse {
  FeatureFlag flag = 1;
}

message SetFlagResponse {
  FeatureFlag flag = 1;
}

message DeleteFlagResponse {
  bool success = 1;
}

message FeatureFlag {
  string id = 1;
  bool enabled = 2;
  optional string description = 3;
}